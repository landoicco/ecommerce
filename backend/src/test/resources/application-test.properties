# The datasource comes from the Testcontainers PostgreSQL container
# (see TestcontainersConfiguration). Flyway stays enabled and Hibernate only
# validates, so every test run also checks the migrations against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Mock data as placeholders for env variables and CORS
frontend.url=http://localhost:3000
FRONTEND_URL=http://localhost:3000

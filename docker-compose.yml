services:
  backend:
    build: backend/
    image: ecommerce-backend-img
    container_name: ecommerce-backend-cont
    ports:
      - "8080:8080"
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=local
    # Budget for the 2 GiB demo instance: backend 1 GiB, database 512 MiB, the rest for the OS
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "${BACKEND_HEALTHCHECK_CMD}"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: frontend/
    image: ecommerce-client-img
    container_name: ecommerce-frontend-cont
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    container_name: ecommerce-postgres
    ports:
      - "5432:5432"
    # Each connection costs memory; Hikari's default pool of 10 leaves room for admin sessions
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      # $$ defers expansion to the container, which has the POSTGRES_* variables
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

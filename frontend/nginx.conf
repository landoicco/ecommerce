# Replaces the image's default server. Locally it plays the role CloudFront has in AWS:
# static files from the build, and /api forwarded to the backend on the same origin.
server {
    # nginx-unprivileged cannot bind ports below 1024
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # "backend" is the compose service name, resolved by Docker's DNS
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
